name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: HGT_Finder --version
      - run: HGT_Finder sankey --help
      - run: python -m unittest discover -s tests -v
      - name: Check the published Sankey example
        run: |
          mkdir -p "$RUNNER_TEMP/hgt-finder-example"
          cp docs/examples/LKSZ1/sankey.html "$RUNNER_TEMP/hgt-finder-example/sankey.html"
          node tests/check_sankey.js "$RUNNER_TEMP/hgt-finder-example/sankey.html"
          node tests/check_sankey_rank_controls.js "$RUNNER_TEMP/hgt-finder-example/sankey.html"
          node --check "$RUNNER_TEMP/hgt-finder-example/sankey_script_check.js"
